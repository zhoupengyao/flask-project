{% extends "base.html" %}
{% block title %}{{ '编辑图书' if book else '添加图书' }}{% endblock %}
{% block content %}
<h4>{{ '编辑图书' if book else '添加图书' }}</h4>
<hr>
<form method="post" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">书名 <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" required value="{{ book.title if book else '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">作者 <span class="text-danger">*</span></label>
            <input type="text" name="author" class="form-control" required value="{{ book.author if book else '' }}">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">出版社</label>
            <input type="text" name="publisher" class="form-control" value="{{ book.publisher if book else '' }}">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">ISBN</label>
            <input type="text" name="isbn" class="form-control" value="{{ book.isbn if book else '' }}">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">分类</label>
            <select name="category_id" class="form-select">
                <option value="">无分类</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if book and book.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">售价 <span class="text-danger">*</span></label>
            <input type="number" name="price" class="form-control" step="0.01" required value="{{ book.price if book else '0' }}">
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">原价</label>
            <input type="number" name="original_price" class="form-control" step="0.01" value="{{ book.original_price if book else '' }}">
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">品相</label>
            <select name="condition" class="form-select">
                {% for val in ['全新', '九五新', '九成新', '八成新', '七成新', '有瑕疵'] %}
                    <option value="{{ val }}" {% if book and book.condition == val %}selected{% endif %}>{{ val }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3 mb-3">
            <label class="form-label">库存</label>
            <input type="number" name="stock" class="form-control" value="{{ book.stock if book else '1' }}">
        </div>
        <div class="col-12 mb-3">
            <label class="form-label">封面图片</label>
            {% if book and book.cover_url %}
                <div class="mb-2">
                    <img src="{{ url_for('static', filename='uploads/' + book.cover_url) }}" alt="当前封面" style="max-height: 120px;">
                    <small class="text-muted ms-2">当前封面</small>
                </div>
            {% endif %}
            <input type="file" name="cover_image" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
        </div>
        <div class="col-12 mb-3">
            <label class="form-label">图书简介</label>
            <textarea name="description" class="form-control" rows="4">{{ book.description if book else '' }}</textarea>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ '更新' if book else '添加' }}</button>
    <a href="{{ url_for('admin.books') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
