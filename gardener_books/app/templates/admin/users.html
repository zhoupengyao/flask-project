{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<h4>用户管理</h4>
<table class="table table-hover">
    <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>手机号</th>
            <th>管理员</th>
            <th>注册时间</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.phone }}</td>
            <td>
                {% if u.is_admin %}
                    <span class="badge bg-danger">店长</span>
                {% else %}
                    <span class="badge bg-secondary">用户</span>
                {% endif %}
            </td>
            <td>{{ u.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
