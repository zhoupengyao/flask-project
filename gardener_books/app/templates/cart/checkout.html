{% extends "base.html" %}
{% block title %}确认订单{% endblock %}
{% block content %}
<h4>确认订单</h4>

<div class="row">
    <div class="col-md-8">
        <div class="card mb-3">
            <div class="card-header">收货信息</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">收货地址 <span class="text-danger">*</span></label>
                        <input type="text" name="address" class="form-control" required maxlength="500" placeholder="省/市/区/详细地址">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">联系电话 <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" required maxlength="20" placeholder="手机号码">
                    </div>
                    <button type="submit" class="btn btn-success w-100">提交订单</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-header">订单摘要</div>
            <div class="card-body">
                <table class="table table-sm">
                    {% for item in items %}
                    <tr>
                        <td>{{ item.book.title }} x {{ item.quantity }}</td>
                        <td class="text-end">¥{{ "%.2f"|format(item.book.price * item.quantity) }}</td>
                    </tr>
                    {% endfor %}
                </table>
                <hr>
                <div class="d-flex justify-content-between">
                    <strong>合计：</strong>
                    <strong class="text-danger">¥{{ "%.2f"|format(total) }}</strong>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
